  <!-- Bottom Strip -->
  <text x="108" y="582" fill="#52565e" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">FEI SEARCH PORTAL • PHYSICAL ADDRESS MATCH • COSMETICS DIRECT</text>
  <text x="1104" y="582" text-anchor="end" fill="#0d1526" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="2">5P PRACTICAL PDF</text>
