      <stop offset="0%" stop-color="#0d1321"/>
      <stop offset="55%" stop-color="#111d36"/>
      <stop offset="100%" stop-color="#0b101b"/>
    </linearGradient>
    <pattern id="editorialGrid" width="60" height="60" patternUnits="userSpaceOnUse">
